name: reels

# Türkiye saatiyle 06:15–19:45 arası yarım saatte bir (UTC+3). Günün planı 06:00 sonrası kurulur, Reels 10:30 ve 17:30 civarı.
on:
  schedule:
    - cron: '15,45 3-16 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Deneme (örnek video, test.mp4)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq
      - name: Reels işle
        env:
          GH_TOKEN: ${{ github.token }}
          TEST: ${{ inputs.test && '1' || '0' }}
        run: bash encode.sh
